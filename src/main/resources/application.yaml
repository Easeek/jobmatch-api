spring:
  application:
    name: jobmatch-api
  datasource:
    url: jdbc:postgresql://localhost:5432/jobmatch
    username: jobmatch
    password: jobmatchpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 sql/schema.sql 로 직접 관리, 자동 생성 금지
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080